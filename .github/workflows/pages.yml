name: Bygg och publicera PDF

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4
        with:
          typst-version: 0.15.1
          cache-dependency-path: anteckningar-3b1b.typ

      - name: Kompilera
        run: |
          mkdir -p site
          typst compile main.typ site/MVE670-anteckningar.pdf
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>MVE670 – anteckningar</title>
          <style>html,body{margin:0;height:100%;background:#1e1e1e}embed{width:100%;height:100%;border:0}</style>
          <embed src="MVE670-anteckningar.pdf" type="application/pdf">
          HTML

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
